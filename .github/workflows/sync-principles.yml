name: Sync Principles.md

# Principles.md is authored upstream at blunderbus88/Bitcoin (principles.md on
# main). This repo's copy is what src/lib/principles.ts reads live from disk
# on every request, so keeping it in sync here is enough to keep the site
# current — no rebuild or redeploy step needed for content changes.
#
# Whenever the sync actually changes Principles.md, it also runs
# `release-principles.mjs --auto`, which publishes the new text as the next
# minor version (see scripts/release-principles.mjs) so the displayed hash
# and version always match what's on the page. A no-op sync (upstream
# unchanged) never touches versioning.

on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch canonical Principles.md
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/blunderbus88/Bitcoin/main/principles.md" \
            -o /tmp/source-principles.md

      - name: Normalize and compare
        id: diff
        run: |
          # Strip trailing whitespace and collapse trailing blank lines so
          # formatting-only noise from the source repo doesn't trigger a commit.
          sed -e 's/[ \t]*$//' /tmp/source-principles.md > /tmp/trimmed.md
          printf '%s\n' "$(cat /tmp/trimmed.md)" > /tmp/normalized.md

          if diff -q /tmp/normalized.md Principles.md > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            cp /tmp/normalized.md Principles.md
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.diff.outputs.changed == 'true'
        with:
          node-version: 20

      - name: Auto-release the new version
        if: steps.diff.outputs.changed == 'true'
        run: node scripts/release-principles.mjs --auto

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Principles.md content/principles-meta.json content/principles-archive/
          git commit -m "sync: update Principles.md from blunderbus88/Bitcoin@main and auto-release"
          git push
