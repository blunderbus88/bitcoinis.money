name: Sync Principles.md

# Principles.md is authored upstream at blunderbus88/Bitcoin (principles.md on
# main). This workflow fetches it into a local, gitignored Principles.md —
# scratch input for release-principles.mjs, never committed and never read by
# the running site (src/lib/principles.ts reads content/principles-archive/
# via content/principles-meta.json instead, so displayed text and hash can
# never drift apart).
#
# release-principles.mjs --auto is always invoked; it already refuses to
# publish when the content's hash hasn't changed, so an idle sync tick
# touches nothing and this workflow only commits when there's a real,
# hash-pinned new version to record.

on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and normalize canonical Principles.md
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/blunderbus88/Bitcoin/main/principles.md" \
            -o /tmp/source-principles.md

          # Strip trailing whitespace and collapse trailing blank lines so
          # formatting-only noise from the source repo doesn't trigger a release.
          sed -e 's/[ \t]*$//' /tmp/source-principles.md > /tmp/trimmed.md
          printf '%s\n' "$(cat /tmp/trimmed.md)" > Principles.md

      - name: Auto-release if content changed
        id: release
        run: |
          node scripts/release-principles.mjs --auto
          if git status --porcelain content/principles-meta.json content/principles-archive/ | grep -q .; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.release.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/principles-meta.json content/principles-archive/
          git commit -m "release: auto-publish Principles.md update from blunderbus88/Bitcoin@main"
          git push

      # A push made with the default GITHUB_TOKEN doesn't trigger other
      # workflows' `on: push` (GitHub's anti-recursion safeguard), so
      # deploy.yml would otherwise sit idle until its next scheduled tick —
      # which can lag well behind its nominal 5-minute interval. Dispatch it
      # directly instead of waiting on that.
      - name: Trigger deploy
        if: steps.release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY"
