name: Deploy to SiteGround

# The SiteGround account hosting bitcoinis.money is memory-constrained enough
# that Astro's compiler (always WebAssembly-based, not just a fallback) fails
# with a WASM out-of-memory error when `npm run build` runs there directly —
# confirmed live. So the build happens here in CI instead, and only the
# finished dist/ output is pushed to the server.
#
# This account's plan doesn't allow changing the primary domain's document
# root either (no such option in Site Tools), so dist/ deploys straight into
# public_html/ itself — the fixed doc root — rather than a separate dist/
# subdirectory. config.php and the SQLite database live one level up, in
# SITEGROUND_APP_ROOT (public_html's parent), so they're outside the
# web-servable tree and untouched by every deploy's rsync.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          SITE_URL: https://bitcoinis.money
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Bake server path into admin .htaccess
        run: |
          sed -i "s#{{REPO_ROOT}}#${{ secrets.SITEGROUND_APP_ROOT }}#g" dist/php/admin/.htaccess

      - name: Deploy dist/ over SSH
        env:
          SSH_KEY: ${{ secrets.SITEGROUND_SSH_KEY }}
          HOST: ${{ secrets.SITEGROUND_HOST }}
          PORT: ${{ secrets.SITEGROUND_PORT }}
          USERNAME: ${{ secrets.SITEGROUND_USER }}
          APP_ROOT: ${{ secrets.SITEGROUND_APP_ROOT }}
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # --delete keeps public_html/ an exact mirror of dist/ on every
          # deploy; excluded paths are SiteGround-managed (SSL cert
          # challenges, default CGI dir) and must survive redeploys.
          rsync -avz --delete \
            --exclude=.well-known --exclude=cgi-bin \
            -e "ssh -i /tmp/deploy_key -o IdentitiesOnly=yes -p $PORT" \
            dist/ "$USERNAME@$HOST:$APP_ROOT/public_html/"

          rm -f /tmp/deploy_key
